 plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ariel.travis'
    compileSdk 34

    defaultConfig {
        applicationId "com.ariel.travis"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

  buildConfigField "String", "GROQ_API_KEY", "\"${System.getenv('GROQ_API_KEY') ?: ''}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
    buildConfig true
    }

    // Vosk (via JNA) ships some overlapping META-INF metadata across its
    // dependencies - without excluding these, the build fails with
    // "More than one file was found with OS independent path 'META-INF/...'"
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // Offline speech recognition - replaces Android's built-in SpeechRecognizer,
    // which depends on the Google app being installed (it isn't, on this device).
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
}